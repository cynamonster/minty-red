    <!-- Instant redirect from legacy ?game= URLs to /[game] -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var game = params.get('game');
          if (game) {
            params.delete('game');
            var search = params.toString();
            var newPath = '/' + encodeURIComponent(game.toLowerCase()) + (search ? '?' + search : '') + window.location.hash;
            window.history.replaceState(null, '', newPath);
          }
        } catch (e) {}
      })();
    </script>
